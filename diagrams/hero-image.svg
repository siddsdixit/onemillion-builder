<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050810"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B2B"/>
      <stop offset="100%" style="stop-color:#FF9A4D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FF8C00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g opacity="0.06" stroke="#FF6B2B" stroke-width="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="480"/>
    <line x1="300" y1="0" x2="300" y2="480"/>
    <line x1="450" y1="0" x2="450" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="750" y1="0" x2="750" y2="480"/>
    <line x1="900" y1="0" x2="900" y2="480"/>
    <line x1="1050" y1="0" x2="1050" y2="480"/>
  </g>

  <!-- Big 1M background watermark -->
  <text x="900" y="380" font-family="'Helvetica Neue', Arial, sans-serif" font-size="320" font-weight="900" fill="#FF6B2B" opacity="0.04" text-anchor="middle">1M</text>

  <!-- Left side — course identity -->
  <g transform="translate(80, 100)">
    <!-- Label -->
    <rect x="0" y="0" width="140" height="28" rx="4" fill="#FF6B2B" opacity="0.15"/>
    <rect x="0" y="0" width="140" height="28" rx="4" fill="none" stroke="#FF6B2B" stroke-width="1" opacity="0.4"/>
    <text x="70" y="19" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#FF6B2B" text-anchor="middle" letter-spacing="2">FREE · OPEN SOURCE</text>

    <!-- Main headline -->
    <text x="0" y="82" font-family="'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="900" fill="#FFFFFF" letter-spacing="-1">Build ONE</text>
    <text x="0" y="148" font-family="'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="900" fill="#FFFFFF" letter-spacing="-1">real AI product</text>
    <text x="0" y="214" font-family="'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="900" fill="url(#orangeGrad)" letter-spacing="-1" filter="url(#glow)">in 18 days.</text>

    <!-- Subline -->
    <text x="0" y="268" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8B9CC4" font-weight="400">Deployed. Real users. On your résumé.</text>

    <!-- Stats row -->
    <g transform="translate(0, 305)">
      <text x="0" y="0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="url(#goldGrad)">18</text>
      <text x="36" y="0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#6B7A99" font-weight="500">days</text>
      <text x="90" y="0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="url(#goldGrad)">1–2h</text>
      <text x="148" y="0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#6B7A99" font-weight="500">/day</text>
      <text x="200" y="0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="url(#goldGrad)">~$10</text>
      <text x="265" y="0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#6B7A99" font-weight="500">total cost</text>
      <text x="360" y="0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="url(#goldGrad)">∞</text>
      <text x="384" y="0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#6B7A99" font-weight="500">free, forever</text>
    </g>
  </g>

  <!-- Right side — 18 day visual -->
  <g transform="translate(740, 60)">
    <!-- Week labels -->
    <text x="20" y="20" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#FF6B2B" font-weight="700" letter-spacing="2">WEEK 1 — FOUNDATION</text>
    <text x="155" y="20" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#4ECDC4" font-weight="700" letter-spacing="2">WEEK 2 — AI</text>
    <text x="290" y="20" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#FFD700" font-weight="700" letter-spacing="2">WEEK 3 — SHIP</text>

    <!-- Day grid - 6 cols × 3 rows -->
    <!-- Week 1 days -->
    <g fill="#FF6B2B">
      <rect x="0" y="32" width="24" height="24" rx="4" opacity="0.9"/>
      <rect x="30" y="32" width="24" height="24" rx="4" opacity="0.8"/>
      <rect x="60" y="32" width="24" height="24" rx="4" opacity="0.7"/>
      <rect x="90" y="32" width="24" height="24" rx="4" opacity="0.6"/>
      <rect x="120" y="32" width="24" height="24" rx="4" opacity="0.5"/>
      <rect x="0" y="62" width="24" height="24" rx="4" opacity="0.4"/>
    </g>
    <!-- Day labels -->
    <text x="12" y="48" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="700">1</text>
    <text x="42" y="48" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="700">2</text>
    <text x="72" y="48" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="700">3</text>
    <text x="102" y="48" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="700">4</text>
    <text x="132" y="48" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="700">5</text>
    <text x="12" y="78" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="700">6</text>

    <!-- Week 2 days -->
    <g fill="#4ECDC4">
      <rect x="135" y="62" width="24" height="24" rx="4" opacity="0.9"/>
      <rect x="165" y="62" width="24" height="24" rx="4" opacity="0.8"/>
      <rect x="195" y="62" width="24" height="24" rx="4" opacity="0.7"/>
      <rect x="225" y="62" width="24" height="24" rx="4" opacity="0.6"/>
      <rect x="255" y="62" width="24" height="24" rx="4" opacity="0.5"/>
      <rect x="135" y="92" width="24" height="24" rx="4" opacity="0.4"/>
    </g>
    <text x="147" y="78" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="700">7</text>
    <text x="177" y="78" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="700">8</text>
    <text x="207" y="78" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="700">9</text>
    <text x="237" y="78" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="700">10</text>
    <text x="267" y="78" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="700">11</text>
    <text x="147" y="108" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="700">12</text>

    <!-- Week 3 days -->
    <g fill="#FFD700">
      <rect x="270" y="92" width="24" height="24" rx="4" opacity="0.9"/>
      <rect x="300" y="92" width="24" height="24" rx="4" opacity="0.8"/>
      <rect x="330" y="92" width="24" height="24" rx="4" opacity="0.7"/>
      <rect x="270" y="122" width="24" height="24" rx="4" opacity="0.6"/>
      <rect x="300" y="122" width="24" height="24" rx="4" opacity="0.5"/>
      <rect x="330" y="122" width="24" height="24" rx="4" opacity="0.9" filter="url(#glow)"/>
    </g>
    <text x="282" y="108" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#050810" text-anchor="middle" font-weight="700">13</text>
    <text x="312" y="108" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#050810" text-anchor="middle" font-weight="700">14</text>
    <text x="342" y="108" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#050810" text-anchor="middle" font-weight="700">15</text>
    <text x="282" y="138" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#050810" text-anchor="middle" font-weight="700">16</text>
    <text x="312" y="138" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#050810" text-anchor="middle" font-weight="700">17</text>
    <text x="342" y="138" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#050810" text-anchor="middle" font-weight="700">18</text>

    <!-- Builder badge -->
    <g transform="translate(0, 175)">
      <rect x="0" y="0" width="380" height="80" rx="12" fill="#0d1117" stroke="#FFD700" stroke-width="1.5" opacity="0.9"/>
      <rect x="0" y="0" width="380" height="80" rx="12" fill="url(#goldGrad)" opacity="0.04"/>
      <!-- Trophy icon area -->
      <rect x="16" y="16" width="48" height="48" rx="8" fill="#FFD700" opacity="0.1"/>
      <text x="40" y="47" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" text-anchor="middle">🏆</text>
      <!-- Text -->
      <text x="80" y="32" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#FFD700" font-weight="700" letter-spacing="1">BUILDER #0000001</text>
      <text x="80" y="50" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#FFFFFF" font-weight="800">Sid Dixit</text>
      <text x="80" y="68" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#6B7A99">Founding Builder · onemillion.build</text>
      <!-- Verified checkmark -->
      <circle cx="350" cy="40" r="14" fill="#FFD700" opacity="0.15"/>
      <circle cx="350" cy="40" r="14" fill="none" stroke="#FFD700" stroke-width="1.5"/>
      <text x="350" y="45" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#FFD700" text-anchor="middle">✓</text>
    </g>

    <!-- Five pillars pills -->
    <g transform="translate(0, 275)">
      <text x="0" y="0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#6B7A99" letter-spacing="1">THE FIVE PILLARS</text>
      <!-- Pill 1 -->
      <rect x="0" y="10" width="108" height="20" rx="10" fill="#FF6B2B" opacity="0.12"/>
      <rect x="0" y="10" width="108" height="20" rx="10" fill="none" stroke="#FF6B2B" stroke-width="0.8" opacity="0.4"/>
      <text x="54" y="24" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#FF9A4D" text-anchor="middle">Spec before code</text>
      <!-- Pill 2 -->
      <rect x="115" y="10" width="130" height="20" rx="10" fill="#4ECDC4" opacity="0.12"/>
      <rect x="115" y="10" width="130" height="20" rx="10" fill="none" stroke="#4ECDC4" stroke-width="0.8" opacity="0.4"/>
      <text x="180" y="24" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#4ECDC4" text-anchor="middle">Multi-agent decomp</text>
      <!-- Pill 3 -->
      <rect x="252" y="10" width="110" height="20" rx="10" fill="#A78BFA" opacity="0.12"/>
      <rect x="252" y="10" width="110" height="20" rx="10" fill="none" stroke="#A78BFA" stroke-width="0.8" opacity="0.4"/>
      <text x="307" y="24" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#A78BFA" text-anchor="middle">Validation gates</text>
      <!-- Pill 4 -->
      <rect x="0" y="36" width="130" height="20" rx="10" fill="#F472B6" opacity="0.12"/>
      <rect x="0" y="36" width="130" height="20" rx="10" fill="none" stroke="#F472B6" stroke-width="0.8" opacity="0.4"/>
      <text x="65" y="50" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#F472B6" text-anchor="middle">Production hygiene</text>
      <!-- Pill 5 -->
      <rect x="137" y="36" width="120" height="20" rx="10" fill="#FFD700" opacity="0.12"/>
      <rect x="137" y="36" width="120" height="20" rx="10" fill="none" stroke="#FFD700" stroke-width="0.8" opacity="0.4"/>
      <text x="197" y="50" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#FFD700" text-anchor="middle">Human review loop</text>
    </g>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="450" width="1200" height="30" fill="#050810"/>
  <line x1="80" y1="450" x2="1120" y2="450" stroke="#FF6B2B" stroke-width="1" opacity="0.2"/>
  <text x="80" y="470" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#3D4A6B">onemillion.build</text>
  <text x="600" y="470" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#3D4A6B" text-anchor="middle">By Sid Dixit · MIT License · Free forever</text>
  <text x="1120" y="470" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#3D4A6B" text-anchor="end">#BuildingWith1M</text>
</svg>
